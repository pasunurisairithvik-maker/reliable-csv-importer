<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSV Importer</title>
<style>body{font:17px system-ui;background:#f2f5fa;color:#172338;max-width:760px;margin:60px auto;padding:24px}main{background:white;padding:32px;border-radius:16px}button{background:#2359c4;color:white;border:0;border-radius:8px;padding:12px 20px;margin-top:20px;cursor:pointer}pre{white-space:pre-wrap;background:#eef2f8;padding:20px;border-radius:8px}small{color:#566}</style>
<main><h1>Reliable CSV Importer</h1><p>Validate inventory records, keep valid rows, and explain every rejected or duplicate record.</p><p><small>Required columns: product_id, name, price, quantity. UTF-8, maximum 2 MiB. Local learning demo.</small></p>
<form id="form"><input id="file" type="file" accept=".csv" required aria-label="Choose inventory CSV"><br><button>Import inventory</button></form><pre id="result" aria-live="polite">Choose examples/inventory.csv to begin.</pre></main>
<script>document.getElementById('form').onsubmit=async(e)=>{e.preventDefault();const output=document.getElementById('result');const data=new FormData();data.append('file',document.getElementById('file').files[0]);output.textContent='Importing…';try{const response=await fetch('/imports',{method:'POST',body:data});output.textContent=JSON.stringify(await response.json(),null,2);}catch(error){output.textContent='Cannot reach the server. Check that it is running.'}};</script></html>
